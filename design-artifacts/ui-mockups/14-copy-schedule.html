<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="canvas:aspect-ratio" content="375:812"/>
<title>14 复制课表 - 课表管家</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--shadow-brand:0 4px 16px rgba(59,130,246,.12);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#e8eaed;display:grid;place-items:center;font-family:var(--ff);-webkit-font-smoothing:antialiased;}
.phone{position:relative;width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;}

/* Status bar */
.statusbar{flex:0 0 44px;padding:14px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:600;color:var(--fg);}
.statusbar .right{display:flex;align-items:center;gap:5px;}
.statusbar svg{width:16px;height:10px;fill:var(--fg);}
.statusbar .battery{width:24px;}

/* Nav */
.nav{flex:0 0 48px;padding:0 8px;display:flex;align-items:center;background:transparent;}
.nav-back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;}
.nav-back svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-title{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--fg);margin-right:40px;}
.nav-actions{display:flex;align-items:center;gap:2px;}
.nav-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;}
.nav-icon svg{width:20px;height:20px;fill:var(--fg);}

/* Content */
.content{flex:1;overflow-y:auto;padding:20px 20px 60px;display:flex;flex-direction:column;align-items:center;}
.content::-webkit-scrollbar{display:none;}

/* Hero */
.hero{text-align:center;margin-top:32px;margin-bottom:28px;}
.hero-icon{width:64px;height:64px;border-radius:50%;background:var(--c-brand-subtle);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 4px 16px rgba(59,130,246,.1);}
.hero-icon svg{width:30px;height:30px;stroke:var(--c-brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.hero h2{font-size:20px;font-weight:700;color:var(--fg);margin-bottom:8px;}
.hero p{font-size:13px;color:var(--fg-3);line-height:1.6;padding:0 8px;}

/* Input card */
.input-card{width:100%;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:20px;}
.code-input{width:100%;height:50px;border-radius:var(--r-md);border:1.5px solid var(--border-light);background:var(--surface-muted);padding:0 16px;font-size:15px;color:var(--fg);font-family:var(--ff-mono);letter-spacing:.06em;outline:none;transition:.2s;}
.code-input::placeholder{color:var(--fg-3);font-family:var(--ff);letter-spacing:0;}
.code-input:focus{border-color:var(--c-brand);box-shadow:0 0 0 3px rgba(59,130,246,.1);}

.copy-btn{width:100%;height:50px;border-radius:var(--r-md);background:var(--c-brand);color:#fff;font-size:16px;font-weight:600;border:none;cursor:pointer;font-family:var(--ff);transition:.2s;box-shadow:var(--shadow-brand);margin-top:14px;}
.copy-btn:active{background:var(--c-brand-hover);transform:scale(.98);}

/* Safety notice */
.safety{width:100%;background:var(--c-brand-subtle);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:10px;align-items:flex-start;}
.safety-icon{width:22px;height:22px;flex-shrink:0;margin-top:1px;}
.safety-icon svg{width:22px;height:22px;}
.safety p{font-size:12px;color:var(--fg-2);line-height:1.6;}
</style>
</head>
<body>
<main class="phone" data-component="Copy Schedule">
  <div class="statusbar"><span>21:34</span><span class="right"><svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg><svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6.5 4.6L2 6.1c1.8-1.6 4.1-2.5 6.5-2.5 2.4 0 4.7.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6 5 9.1c1-.9 2.2-1.4 3.5-1.4 1.3 0 2.5.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6.7-5 2zM6.5 10.6l2 2 2-2c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8z"/></svg><svg class="battery" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4" fill="currentColor" fill-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg></span></div>

  <!-- Nav -->
  <div class="nav" data-component="Nav Bar">
    <div class="nav-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="nav-title">复制课表</div>
    <div class="nav-actions">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--fg)" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="var(--fg)" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></div>
    </div>
  </div>

  <div class="content">
    <!-- Hero -->
    <div class="hero" data-component="Hero">
      <div class="hero-icon">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </div>
      <h2>复制好友课表</h2>
      <p>输入好友分享的口令，即可一键复制课表内容</p>
    </div>

    <!-- Input card -->
    <div class="input-card" data-component="Code Input">
      <input class="code-input" placeholder="粘贴或输入口令" aria-label="口令"/>
      <button class="copy-btn">一键复制</button>
    </div>

    <!-- Safety notice -->
    <div class="safety" data-component="Safety Notice">
      <div class="safety-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#ef4444" opacity=".15" stroke="#ef4444" stroke-width="1.5"/><path d="M12 8v4M12 16h.01" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <p>安全提示：老师电话等敏感信息不会被复制。建议复制后及时核对课程时间。</p>
    </div>
  </div>
</main>
</body>
</html>
