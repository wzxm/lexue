<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 学生表单 - 课表管家</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
body{background:#e8eaed;display:grid;place-items:center;min-height:100vh;font-family:var(--ff);}
.phone{width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative;}
.status-bar{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;background:var(--surface);flex-shrink:0;}
.status-bar .time{font-size:15px;font-weight:600;color:var(--fg);}
.status-bar .icons{display:flex;gap:5px;align-items:center;}
.status-bar .icons svg{width:16px;height:16px;}
.nav-bar{height:48px;display:flex;align-items:center;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border-light);flex-shrink:0;}
.nav-bar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-bar .back svg{width:20px;height:20px;color:var(--fg);}
.nav-bar .title{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--fg);margin-right:32px;}
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:100px;}
.avatar-section{display:flex;flex-direction:column;align-items:center;padding:24px 0 20px;}
.avatar-wrap{position:relative;width:88px;height:88px;margin-bottom:10px;}
.avatar-circle{width:88px;height:88px;border-radius:50%;background:var(--c-brand-subtle);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.avatar-circle svg{width:40px;height:40px;color:var(--c-brand-light);}
.camera-badge{position:absolute;bottom:0;right:0;width:30px;height:30px;border-radius:50%;background:var(--c-brand);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);}
.camera-badge svg{width:14px;height:14px;color:#fff;}
.avatar-hint{font-size:13px;color:var(--fg-3);}
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:4px 16px;margin-bottom:14px;}
.form-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border-light);}
.form-row:last-child{border-bottom:none;}
.form-row .label{font-size:14px;color:var(--fg);flex-shrink:0;width:70px;}
.form-row input{border:none;outline:none;font-size:14px;color:var(--fg);text-align:right;flex:1;font-family:var(--ff);background:transparent;}
.form-row input::placeholder{color:var(--fg-3);}
.form-row .value{font-size:14px;color:var(--fg-3);text-align:right;flex:1;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.arrow-icon{width:16px;height:16px;color:var(--fg-3);}
/* Gender selector */
.gender-seg{display:flex;gap:0;background:var(--surface-muted);border-radius:var(--r-pill);border:1px solid var(--border-light);padding:2px;overflow:hidden;}
.gender-seg .seg-btn{padding:5px 18px;border-radius:var(--r-pill);font-size:13px;color:var(--fg-3);font-weight:500;cursor:pointer;transition:.2s;border:none;background:transparent;font-family:var(--ff);}
.gender-seg .seg-btn.active{background:var(--c-brand);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(59,130,246,.25);}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,20px));background:transparent;border-top:none;}
.btn-dark{width:100%;height:48px;border-radius:var(--r-md);background:var(--dark-btn);color:#fff;font-size:16px;font-weight:600;border:none;cursor:pointer;font-family:var(--ff);transition:opacity .2s;}
.btn-dark:active{opacity:.85;}
</style>
</head>
<body>
<main class="phone" data-component="Student Form">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg viewBox="0 0 18 18" fill="currentColor"><rect x="1" y="10" width="3" height="6" rx="1" fill="#1a1a2e"/><rect x="5.5" y="7" width="3" height="9" rx="1" fill="#1a1a2e"/><rect x="10" y="4" width="3" height="12" rx="1" fill="#1a1a2e"/><rect x="14.5" y="1" width="3" height="15" rx="1" fill="#1a1a2e"/></svg>
      <svg viewBox="0 0 18 18" fill="none"><path d="M9 4C6 4 3.5 5.2 1.5 7.2L3 8.7C4.6 7.1 6.7 6 9 6s4.4 1.1 6 2.7l1.5-1.5C14.5 5.2 12 4 9 4z" fill="#1a1a2e"/><path d="M9 8C7 8 5.2 8.8 4 10.1L5.5 11.6C6.3 10.8 7.6 10 9 10s2.7.8 3.5 1.6L14 10.1C12.8 8.8 11 8 9 8z" fill="#1a1a2e"/><circle cx="9" cy="14" r="2" fill="#1a1a2e"/></svg>
      <svg viewBox="0 0 28 14" fill="none"><rect x=".5" y=".5" width="23" height="13" rx="3" stroke="#1a1a2e" stroke-opacity=".35"/><rect x="2" y="2" width="18" height="10" rx="1.5" fill="#1a1a2e"/><path d="M25 5v4a2.5 2.5 0 000-4z" fill="#1a1a2e" opacity=".4"/></svg>
    </div>
  </div>
  <!-- Nav Bar -->
  <div class="nav-bar">
    <div class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="title">添加学生</div>
  </div>
  <!-- Content -->
  <div class="content">
    <div class="avatar-section">
      <div class="avatar-wrap">
        <div class="avatar-circle">
          <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="18" r="9" fill="currentColor"/><path d="M6 44c0-9.9 8.1-18 18-18s18 8.1 18 18" fill="currentColor"/></svg>
        </div>
        <div class="camera-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
      </div>
      <span class="avatar-hint">点击设置头像</span>
    </div>
    <div class="card">
      <div class="form-row">
        <span class="label">姓名</span>
        <input type="text" placeholder="输入学生姓名" aria-label="学生姓名">
      </div>
      <div class="form-row">
        <span class="label">性别</span>
        <div class="gender-seg" role="radiogroup" aria-label="性别">
          <button class="seg-btn active" role="radio" aria-checked="true">男</button>
          <button class="seg-btn" role="radio" aria-checked="false">女</button>
        </div>
      </div>
      <div class="form-row">
        <span class="label">学校</span>
        <input type="text" placeholder="输入学校名称" aria-label="学校名称">
      </div>
      <div class="form-row">
        <span class="label">学龄段</span>
        <div class="value">小学，三年级<svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="form-row">
        <span class="label">班级</span>
        <input type="text" placeholder="输入班级" aria-label="班级">
      </div>
      <div class="form-row">
        <span class="label">学号</span>
        <input type="text" placeholder="选填" aria-label="学号">
      </div>
    </div>
  </div>
  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="btn-dark">保存</button>
  </div>
</main>
</body>

</html>
