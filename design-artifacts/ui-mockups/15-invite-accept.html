<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 接受邀请 - 乐学课表</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#e8eaed;display:grid;place-items:center;min-height:100vh;font-family:var(--ff);}
.phone{width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative;}
.status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);flex-shrink:0;}
.status-bar .time{font-size:15px;font-weight:600;color:var(--fg);}
.status-bar .icons{display:flex;gap:6px;align-items:center;}
.nav-bar{height:48px;display:flex;align-items:center;padding:0 16px;background:var(--surface);flex-shrink:0;position:relative;border-bottom:1px solid var(--border-light);}
.nav-bar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-bar .title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;color:var(--fg);}
.content{flex:1;overflow-y:auto;padding:24px 20px 100px;}
.icon-wrap{width:64px;height:64px;border-radius:50%;background:var(--c-brand-subtle);display:flex;align-items:center;justify-content:center;margin:12px auto 20px;}
.main-title{font-size:16px;font-weight:600;color:var(--fg);text-align:center;margin-bottom:8px;}
.subtitle{font-size:13px;color:var(--fg-3);text-align:center;margin-bottom:28px;}
.input-card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-md);padding:20px;margin-bottom:20px;}
.input-card label{font-size:13px;color:var(--fg-2);font-weight:500;display:block;margin-bottom:10px;}
.input-card input{width:100%;height:48px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:var(--ff-mono);font-size:18px;text-align:center;color:var(--fg);outline:none;letter-spacing:2px;transition:border .2s;}
.input-card input:focus{border-color:var(--c-brand);}
.input-card input::placeholder{font-size:14px;color:var(--fg-3);letter-spacing:0;}
.helper{font-size:12px;color:var(--fg-3);text-align:center;margin-top:10px;}
.preview-card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:16px;border:1px solid var(--border-light);}
.preview-card .p-title{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:6px;}
.preview-card .p-meta{font-size:12px;color:var(--fg-3);margin-bottom:12px;}
.color-dots{display:flex;gap:8px;}
.color-dots span{width:18px;height:18px;border-radius:50%;}
.bottom-fixed{position:absolute;bottom:0;left:0;right:0;padding:12px 20px 34px;background:linear-gradient(transparent,var(--bg) 20%);display:flex;flex-direction:column;align-items:center;gap:10px;}
.btn-primary{width:100%;height:48px;border-radius:var(--r-pill);background:var(--c-brand);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;}
.secondary-link{font-size:13px;color:var(--fg-3);cursor:pointer;}
</style>
</head>
<body>
<main class="phone" data-component="Invite Accept">
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="var(--fg)"/><rect x="4.5" y="4" width="3" height="8" rx="1" fill="var(--fg)"/><rect x="9" y="1" width="3" height="11" rx="1" fill="var(--fg)"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="var(--fg)" opacity=".3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2C5.5 2 3.2 3 1.5 4.7L0 3.2C2.1 1.2 4.9 0 8 0s5.9 1.2 8 3.2l-1.5 1.5C12.8 3 10.5 2 8 2z" fill="var(--fg)"/><path d="M8 5.5c-1.7 0-3.2.7-4.3 1.8L2.2 5.8C3.7 4.3 5.7 3.5 8 3.5s4.3.8 5.8 2.3l-1.5 1.5C11.2 6.2 9.7 5.5 8 5.5z" fill="var(--fg)"/><circle cx="8" cy="10" r="2" fill="var(--fg)"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2" stroke="var(--fg)" stroke-width="1" fill="none"/><rect x="22" y="4" width="2" height="4" rx="1" fill="var(--fg)" opacity=".4"/><rect x="1.5" y="2.5" width="15" height="7" rx="1" fill="var(--fg)"/></svg>
    </span>
  </div>
  <div class="nav-bar">
    <div class="back"><svg width="10" height="18" viewBox="0 0 10 18" fill="none"><path d="M9 1L1 9l8 8" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="title">加入共享</span>
  </div>
  <div class="content">
    <div class="icon-wrap">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="7" r="3" stroke="var(--c-brand)" stroke-width="1.8"/><circle cx="17" cy="7" r="2.5" stroke="var(--c-brand)" stroke-width="1.5" opacity=".6"/><path d="M2 20c0-3.3 2.7-6 6-6h2c3.3 0 6 2.7 6 6" stroke="var(--c-brand)" stroke-width="1.8" stroke-linecap="round"/><path d="M16 14c2.2 0 4 1.8 4 4" stroke="var(--c-brand)" stroke-width="1.5" stroke-linecap="round" opacity=".6"/></svg>
    </div>
    <div class="main-title">你收到了一份课表邀请</div>
    <div class="subtitle">家人邀请你查看小明的课表</div>
    <div class="input-card">
      <label>输入分享口令</label>
      <input type="text" placeholder="例如：LX2025-A8K3" value="LX2025-A8K3" aria-label="分享口令">
      <div class="helper">口令由家人分享给你</div>
    </div>
    <div class="preview-card">
      <div class="p-title">小明 · 2025春季学期</div>
      <div class="p-meta">7门课程 · 阳光小学 三年级二班</div>
      <div class="color-dots">
        <span style="background:#3b82f6"></span>
        <span style="background:#ef4444"></span>
        <span style="background:#f59e0b"></span>
        <span style="background:#16a34a"></span>
        <span style="background:#0d9488"></span>
        <span style="background:#ec4899"></span>
        <span style="background:#06b6d4"></span>
      </div>
    </div>
  </div>
  <div class="bottom-fixed">
    <button class="btn-primary">确认加入</button>
    <span class="secondary-link">还没有口令？让家人分享给你</span>
  </div>
</main>
</body>

</html>
