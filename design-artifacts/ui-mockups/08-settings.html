<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 设置页 - 课表管家</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#e8eaed;display:grid;place-items:center;min-height:100vh;font-family:var(--ff);}
.phone{position:relative;width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;}
.status-bar{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);}
.status-time{font-size:15px;font-weight:600;color:var(--fg);}
.status-icons{display:flex;align-items:center;gap:5px;}
.status-icons svg{width:16px;height:16px;color:var(--fg);}
.nav{flex:0 0 48px;display:flex;align-items:center;justify-content:center;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border-light);position:relative;}
.nav h1{font-size:17px;font-weight:600;color:var(--fg);}
.content{flex:1;overflow-y:auto;padding:16px;}
.section-title{font-size:13px;color:var(--fg-3);font-weight:500;padding:0 4px;margin-bottom:8px;margin-top:16px;}
.section-title:first-child{margin-top:0;}
.section-card{background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm);}
.section-row{display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer;}
.section-row+.section-row{border-top:1px solid var(--border-light);}
.row-icon{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.row-icon svg{width:18px;height:18px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.row-icon-blue{background:var(--c-brand-subtle);color:var(--c-brand);}
.row-icon-blue svg{stroke:var(--c-brand);}
.row-icon-green{background:#f0fdf4;color:var(--success);}
.row-icon-green svg{stroke:var(--success);}
.row-icon-purple{background:#faf5ff;color:#0d9488;}
.row-icon-purple svg{stroke:#0d9488;}
.row-icon-orange{background:#fff7ed;color:#f97316;}
.row-icon-orange svg{stroke:#f97316;}
.row-icon-teal{background:#f0fdfa;color:#14b8a6;}
.row-icon-teal svg{stroke:#14b8a6;}
.row-icon-gray{background:var(--surface-muted);color:var(--fg-3);}
.row-icon-gray svg{stroke:var(--fg-3);}
.row-icon-rose{background:#fff1f2;color:#f43f5e;}
.row-icon-rose svg{stroke:#f43f5e;}
.row-label{flex:1;font-size:15px;color:var(--fg);}
.row-meta{font-size:13px;color:var(--fg-3);}
.row-arrow{width:16px;height:16px;stroke:var(--fg-3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.tab-bar{flex:0 0 83px;display:flex;align-items:flex-start;justify-content:space-around;padding-top:8px;background:var(--surface);border-top:1px solid var(--border-light);}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;}
.tab-item svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.tab-item span{font-size:10px;font-weight:500;}
.tab-item.active svg{stroke:var(--c-brand);}
.tab-item.active span{color:var(--c-brand);}
.tab-item:not(.active) svg{stroke:var(--fg-3);}
.tab-item:not(.active) span{color:var(--fg-3);}
.home-indicator{flex:0 0 0px;}
</style>
</head>
<body>
<main class="phone" data-component="Settings Page">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h2v4H2zm4-4h2v8H6zm4-4h2v12h-2zm4-4h2v16h-2zm4 8h2v8h-2z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 00-6 0zm-4-4l2 2a7.07 7.07 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="8" width="12" height="8" rx="1" fill="currentColor" opacity=".7"/><path d="M22 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div class="nav">
    <h1>设置</h1>
  </div>
  <div class="content">
    <div class="section-title">课表管理</div>
    <div class="section-card">
      <div class="section-row">
        <div class="row-icon row-icon-blue"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></div>
        <span class="row-label">学生管理</span>
        <svg class="row-arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="section-row">
        <div class="row-icon row-icon-green"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
        <span class="row-label">课表管理</span>
        <svg class="row-arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="section-row">
        <div class="row-icon row-icon-purple"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></div>

      </div>
    </div>
    <div class="section-title">通知与显示</div>
    <div class="section-card">
      <div class="section-row">
        <div class="row-icon row-icon-orange"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg></div>
        <span class="row-label">提醒设置</span>
        <svg class="row-arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="section-row">
        <div class="row-icon row-icon-teal"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></div>
        <span class="row-label">显示设置</span>
        <svg class="row-arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
    <div class="section-title">其他</div>
    <div class="section-card">
      <div class="section-row">
        <div class="row-icon row-icon-gray"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></div>
        <span class="row-label">关于课表管家</span>
        <span class="row-meta">v2.1.0</span>
        <svg class="row-arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="section-row">
        <div class="row-icon row-icon-rose"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
        <span class="row-label">意见反馈</span>
        <svg class="row-arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>课表</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 00-8 0v2"/></svg>

    <div class="tab-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>设置</span>
    </div>
  </div>
  <div class="home-indicator"></div>
</main>
</body>

</html>
