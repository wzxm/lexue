<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="canvas:aspect-ratio" content="375:812"/>
<title>02 登录页 - 乐学课表</title>
<style>
:root{
  --c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;
  --c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;
  --bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;
  --fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;
  --border:#e5e7eb;--border-light:#f2f3f5;
  --danger:#ef4444;--success:#16a34a;--warn:#f59e0b;
  --dark-btn:#181e25;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.06);
  --shadow-brand:0 4px 16px rgba(59,130,246,.12);
  --shadow-lg:0 8px 32px rgba(0,0,0,.08);
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;
  --ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  --ff-mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#e8eaed;display:grid;place-items:center;font-family:var(--ff);-webkit-font-smoothing:antialiased;}

.phone{position:relative;width:375px;height:812px;background:linear-gradient(180deg,var(--c-brand-subtle) 0%,#e8eef8 40%,var(--bg) 100%);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;}

.statusbar{flex:0 0 44px;padding:14px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:600;color:var(--fg);}
.statusbar .right{display:flex;align-items:center;gap:5px;}
.statusbar svg{width:16px;height:10px;fill:var(--fg);}
.statusbar .battery{width:24px;}

.content{flex:1;display:flex;flex-direction:column;padding:0 24px;overflow:hidden;}

/* Brand area */
.brand-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:20px;}
.logo-icon{width:72px;height:72px;border-radius:var(--r-xl);background:linear-gradient(135deg,var(--c-brand) 0%,var(--c-brand-deep) 100%);display:grid;place-items:center;margin-bottom:16px;box-shadow:0 8px 24px rgba(59,130,246,.25);}
.logo-icon svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:1.6;}
.app-name{font-size:28px;font-weight:700;color:var(--c-brand-deep);letter-spacing:-.02em;margin-bottom:6px;}
.app-slogan{font-size:14px;color:var(--fg-2);margin-bottom:28px;line-height:1.5;}

/* Feature chips */
.features{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:24px;}
.feature-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--surface);border-radius:var(--r-pill);font-size:12px;color:var(--fg-2);box-shadow:var(--shadow-sm);font-weight:500;}
.feature-chip svg{width:16px;height:16px;stroke:var(--c-brand);fill:none;stroke-width:1.8;}

/* Login card */
.login-card{background:var(--surface);border-radius:var(--r-xl);padding:24px;box-shadow:var(--shadow-lg);margin-bottom:32px;}
.login-title{font-size:16px;font-weight:600;color:var(--fg);margin-bottom:16px;text-align:center;}
.agreement{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px;}
.checkbox{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;display:grid;place-items:center;cursor:pointer;}
.checkbox.checked{background:var(--c-brand);border-color:var(--c-brand);}
.checkbox.checked svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.5;}
.agreement-text{font-size:11.5px;color:var(--fg-3);line-height:1.5;}
.agreement-text a{color:var(--c-brand);text-decoration:none;}
.login-btn{width:100%;padding:14px;background:var(--c-brand);color:#fff;border:none;border-radius:var(--r-md);font-size:16px;font-weight:600;cursor:pointer;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(59,130,246,.3);transition:.2s;}
.login-btn:hover{background:var(--c-brand-hover);transform:translateY(-1px);}
.login-btn svg{width:20px;height:20px;fill:#fff;}

.bottom-text{text-align:center;font-size:11px;color:var(--fg-3);padding-bottom:28px;}

.home-ind{height:28px;position:relative;}
.home-ind::after{content:'';position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;background:var(--fg);border-radius:999px;opacity:.18;}
</style>
</head>
<body>
<main class="phone" data-component="Login Page">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg>
      <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6.5 4.6L2 6.1c1.8-1.6 4.1-2.5 6.5-2.5 2.4 0 4.7.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6 5 9.1c1-.9 2.2-1.4 3.5-1.4 1.3 0 2.5.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6.7-5 2zM6.5 10.6l2 2 2-2c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8z"/></svg>
      <svg class="battery" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4" fill="currentColor" fill-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
    </span>
  </div>

  <div class="content">
    <div class="brand-area" data-component="Brand Area">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 4V2M16 4V2"/><circle cx="12" cy="15" r="1.5"/></svg>
      </div>
      <div class="app-name">乐学课表</div>
      <div class="app-slogan">让每个家庭的课表管理更轻松</div>

      <div class="features" data-component="Feature Chips">
        <div class="feature-chip">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          家庭共享
        </div>
        <div class="feature-chip">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 4V2M16 4V2"/></svg>
          多孩课表
        </div>
        <div class="feature-chip">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          上课提醒
        </div>
        <div class="feature-chip">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><path d="m9 12 2 2 4-4"/></svg>
          AI 识别
        </div>
      </div>
    </div>

    <div class="login-card" data-component="Login Card">
      <div class="login-title">登录后可管理课表</div>
      <div class="agreement">
        <div class="checkbox checked">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="agreement-text">我已阅读并同意<a href="#user-agreement">《用户协议》</a>和<a href="#privacy-policy">《隐私政策》</a></div>
      </div>
      <button class="login-btn">
        <svg viewBox="0 0 24 24"><path d="M8.5 2A6.5 6.5 0 0 0 2 8.5c0 2.1.9 3.9 2.4 5.2L3 18l4.5-1.3c.6.2 1.3.3 2 .3a6.5 6.5 0 0 0 0-13z"/><path d="M15.5 8A5.5 5.5 0 0 1 21 13.5c0 1.8-.8 3.3-2 4.3l1 3.2-3.5-1c-.5.1-1 .2-1.5.2a5.5 5.5 0 0 1 0-11z" fill-opacity=".6"/></svg>
        微信一键登录
      </button>
    </div>

    <div class="bottom-text">无需注册账号，基于微信安全登录</div>
  </div>

  <div class="home-ind"></div>
</main>
</body>

</html>
