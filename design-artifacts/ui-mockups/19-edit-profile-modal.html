<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="canvas:aspect-ratio" content="375:812"/>
<title>19 修改资料弹窗 - 课表管家</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;--avatar-from:#dbeafe;--avatar-to:#bfdbfe;--c-teal:#14b8a6;--c-orange:#f97316;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#e8eaed;display:grid;place-items:center;font-family:var(--ff);-webkit-font-smoothing:antialiased;}

.phone{position:relative;width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;}

/* Status bar */
.statusbar{flex:0 0 44px;padding:14px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:600;color:var(--fg);}
.statusbar .right{display:flex;align-items:center;gap:5px;}
.statusbar svg{width:16px;height:10px;fill:var(--fg);}
.statusbar .battery{width:24px;}

/* Profile header (background) */
.profile-header{padding:16px 20px 14px;background:var(--surface);display:flex;align-items:center;gap:14px;}
.profile-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--avatar-from),var(--avatar-to));display:grid;place-items:center;flex-shrink:0;border:2px solid #fff;box-shadow:var(--shadow-sm);}
.profile-avatar svg{width:26px;height:26px;stroke:var(--c-brand);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.profile-info{flex:1;min-width:0;}
.profile-name{font-size:17px;font-weight:600;color:var(--fg);margin-bottom:2px;}
.profile-id{font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:4px;}
.profile-id svg{width:12px;height:12px;stroke:var(--fg-3);fill:none;stroke-width:2;}

/* Content (background, dimmed) */
.bg-content{flex:1;overflow-y:auto;padding:12px 16px;}
.bg-content::-webkit-scrollbar{display:none;}
.section-card{background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:12px;}
.section-row{display:flex;align-items:center;padding:13px 16px;gap:12px;cursor:pointer;}
.section-row+.section-row{border-top:1px solid var(--border-light);}
.row-icon{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.row-icon svg{width:16px;height:16px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.ri-blue{background:var(--c-brand-subtle);}
.ri-blue svg{stroke:var(--c-brand);}
.ri-green{background:#f0fdf4;}
.ri-green svg{stroke:var(--success);}
.ri-orange{background:#fff7ed;}
.ri-orange svg{stroke:var(--c-orange);}
.ri-teal{background:#f0fdfa;}
.ri-teal svg{stroke:var(--c-teal);}
.row-label{flex:1;font-size:14px;color:var(--fg);}
.row-meta{font-size:13px;color:var(--fg-3);}
.row-arrow{width:14px;height:14px;stroke:var(--fg-3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* ─── Center Modal ─── */
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:10;}

.center-modal{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);z-index:11;background:var(--surface);border-radius:var(--r-lg);padding:0;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:modalIn .25s ease;}

@keyframes modalIn{from{opacity:0;transform:translateY(-50%) scale(.95)}to{opacity:1;transform:translateY(-50%) scale(1)}}

/* Modal header */
.modal-header{padding:18px 20px 14px;text-align:center;border-bottom:1px solid var(--border-light);}
.modal-title{font-size:17px;font-weight:600;color:var(--fg);}

/* Modal body */
.modal-body{padding:24px 20px 12px;display:flex;flex-direction:column;align-items:center;gap:20px;}

/* Avatar with camera badge */
.avatar-wrap{position:relative;cursor:pointer;}
.modal-avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--avatar-from),var(--avatar-to));display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 16px rgba(59,130,246,.12);}
.modal-avatar svg{width:38px;height:38px;stroke:var(--c-brand);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.camera-badge{position:absolute;bottom:0;right:-2px;width:26px;height:26px;border-radius:50%;background:var(--c-brand);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(59,130,246,.3);}
.camera-badge svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* Form fields */
.form-group{width:100%;display:flex;flex-direction:column;gap:6px;}
.form-group-label{display:flex;align-items:center;justify-content:space-between;padding:0 2px;}
.form-group-label span{font-size:13px;color:var(--fg-3);font-weight:500;}
.sync-link{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--c-brand);font-weight:500;cursor:pointer;}
.sync-link svg{width:13px;height:13px;stroke:var(--c-brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.field-row{display:flex;align-items:center;gap:8px;}
.form-input{flex:1;height:50px;padding:0 14px;background:var(--surface-muted);border-radius:var(--r-md);border:1px solid var(--border-light);font-size:15px;color:var(--fg);font-family:var(--ff);outline:none;transition:.2s;}
.form-input:focus{border-color:var(--c-brand);box-shadow:0 0 0 3px rgba(59,130,246,.08);}

/* Modal footer */
.modal-footer{padding:16px 20px 20px;display:flex;gap:12px;}
.btn-cancel{flex:1;height:46px;border-radius:var(--r-md);background:var(--surface-muted);color:var(--fg-2);font-size:15px;font-weight:500;border:1px solid var(--border-light);cursor:pointer;font-family:var(--ff);transition:.15s;}
.btn-cancel:hover{background:var(--border-light);}
.btn-save{flex:1;height:46px;border-radius:var(--r-md);background:var(--c-brand);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:var(--ff);box-shadow:0 2px 8px rgba(59,130,246,.25);transition:.15s;}
.btn-save:hover{background:var(--c-brand-hover);}
.btn-save:active{transform:scale(.98);}
</style>
</head>
<body>
