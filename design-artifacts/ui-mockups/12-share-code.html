<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 分享口令 - 乐学课表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
body{background:#e8eaed;display:grid;place-items:center;min-height:100vh;font-family:var(--ff);}
.phone{width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative;}
.status-bar{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;background:var(--surface);flex-shrink:0;}
.status-bar .time{font-size:15px;font-weight:600;color:var(--fg);}
.status-bar .icons{display:flex;gap:5px;align-items:center;}
.status-bar .icons svg{width:16px;height:16px;}
.nav-bar{height:48px;display:flex;align-items:center;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border-light);flex-shrink:0;}
.nav-bar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-bar .back svg{width:20px;height:20px;color:var(--fg);}
.nav-bar .title{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--fg);margin-right:32px;}
.content{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;align-items:center;}
.share-card{width:100%;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:32px 24px 24px;display:flex;flex-direction:column;align-items:center;margin-bottom:20px;}
.share-icon{width:56px;height:56px;border-radius:16px;background:var(--c-brand-subtle);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.share-icon svg{width:28px;height:28px;color:var(--c-brand);}
.share-subtitle{font-size:16px;font-weight:600;color:var(--fg);margin-bottom:20px;}
.code-display{width:100%;background:var(--c-brand-subtle);border-radius:var(--r-md);padding:16px;text-align:center;margin-bottom:16px;}
.code-text{font-family:var(--ff-mono);font-size:22px;font-weight:700;color:var(--c-brand-deep);letter-spacing:2px;}
.code-meta{font-size:13px;color:var(--fg-3);margin-bottom:20px;}
.btn-brand{width:100%;height:46px;border-radius:var(--r-md);background:var(--c-brand);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:var(--ff);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s;}
.btn-brand:active{background:var(--c-brand-hover);}
.info-text{font-size:13px;color:var(--fg-2);line-height:1.7;text-align:center;margin-bottom:12px;padding:0 8px;}
.info-secondary{font-size:12px;color:var(--fg-3);line-height:1.7;text-align:center;padding:0 8px;}
</style>
</head>
<body>
<main class="phone" data-component="Share Code">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg viewBox="0 0 18 18" fill="currentColor"><rect x="1" y="10" width="3" height="6" rx="1" fill="#1a1a2e"/><rect x="5.5" y="7" width="3" height="9" rx="1" fill="#1a1a2e"/><rect x="10" y="4" width="3" height="12" rx="1" fill="#1a1a2e"/><rect x="14.5" y="1" width="3" height="15" rx="1" fill="#1a1a2e"/></svg>
      <svg viewBox="0 0 18 18" fill="none"><path d="M9 4C6 4 3.5 5.2 1.5 7.2L3 8.7C4.6 7.1 6.7 6 9 6s4.4 1.1 6 2.7l1.5-1.5C14.5 5.2 12 4 9 4z" fill="#1a1a2e"/><path d="M9 8C7 8 5.2 8.8 4 10.1L5.5 11.6C6.3 10.8 7.6 10 9 10s2.7.8 3.5 1.6L14 10.1C12.8 8.8 11 8 9 8z" fill="#1a1a2e"/><circle cx="9" cy="14" r="2" fill="#1a1a2e"/></svg>
      <svg viewBox="0 0 28 14" fill="none"><rect x=".5" y=".5" width="23" height="13" rx="3" stroke="#1a1a2e" stroke-opacity=".35"/><rect x="2" y="2" width="18" height="10" rx="1.5" fill="#1a1a2e"/><path d="M25 5v4a2.5 2.5 0 000-4z" fill="#1a1a2e" opacity=".4"/></svg>
    </div>
  </div>
  <!-- Nav Bar -->
  <div class="nav-bar">
    <div class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="title">分享口令</div>
  </div>
  <!-- Content -->
  <div class="content">
    <div class="share-card">
      <div class="share-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <div class="share-subtitle">小明的课表</div>
      <div class="code-display">
        <div class="code-text">LX2025-A8K3</div>
      </div>
      <div class="code-meta">有效期：7天</div>
      <button class="btn-brand">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        复制口令
      </button>
    </div>
    <p class="info-text">将口令发送给家人，家人可在小程序中输入口令加入共享。</p>
    <p class="info-secondary">口令有效期内，家人可随时通过口令加入。过期后需重新生成。</p>
  </div>
</main>
</body>

</html>
