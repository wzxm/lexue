<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="canvas:aspect-ratio" content="375:812"/>
<title>10 课表创建 - 课表管家</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--shadow-brand:0 4px 16px rgba(59,130,246,.12);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#e8eaed;display:grid;place-items:center;font-family:var(--ff);-webkit-font-smoothing:antialiased;}
.phone{position:relative;width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;}

/* Status bar */
.statusbar{flex:0 0 44px;padding:14px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:600;color:var(--fg);}
.statusbar .right{display:flex;align-items:center;gap:5px;}
.statusbar svg{width:16px;height:10px;fill:var(--fg);}
.statusbar .battery{width:24px;}

/* Nav */
.nav{flex:0 0 48px;padding:0 8px;display:flex;align-items:center;background:transparent;}
.nav-back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;}
.nav-back svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-title{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--fg);margin-right:40px;}
.nav-actions{display:flex;align-items:center;gap:2px;}
.nav-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;}
.nav-icon svg{width:20px;height:20px;fill:var(--fg);}

.content{flex:1;overflow-y:auto;padding:8px 16px 120px;}
.content::-webkit-scrollbar{display:none;}

/* Steps */
.steps{display:flex;align-items:center;gap:0;margin-bottom:18px;padding:0 12px;}
.step{display:flex;align-items:center;gap:10px;flex:1;}
.step-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--ff-mono);flex-shrink:0;transition:.2s;position:relative;}
.step.active .step-dot{background:var(--c-brand);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.3);}
.step:not(.active) .step-dot{background:var(--surface);color:var(--fg-3);border:1.5px solid var(--border);}
.step-info{display:flex;flex-direction:column;gap:1px;}
.step-text{font-size:13px;font-weight:600;}
.step.active .step-text{color:var(--c-brand);}
.step:not(.active) .step-text{color:var(--fg-3);}
.step-desc{font-size:10px;color:var(--fg-3);font-weight:400;}
.step-connector{width:32px;height:2px;border-radius:1px;background:var(--border);flex-shrink:0;margin:0 4px;position:relative;}
.step-connector::after{content:'';position:absolute;left:0;top:0;height:100%;width:50%;border-radius:1px;background:var(--c-brand);opacity:.5;}

/* Form card */
.form-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px;}
.form-section-title{padding:14px 16px 6px;font-size:12px;color:var(--fg-3);font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
.form-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-light);}
.form-row:last-child{border-bottom:none;}
.form-label{font-size:14px;color:var(--fg);font-weight:500;display:flex;align-items:center;gap:4px;}
.form-label .required{color:var(--danger);font-size:14px;}
.form-value{font-size:14px;color:var(--fg-3);display:flex;align-items:center;gap:4px;}
.form-value.filled{color:var(--fg);}
.form-value .arrow{width:14px;height:14px;stroke:var(--fg-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.form-subtext{padding:6px 16px 14px;font-size:12px;color:var(--fg-3);line-height:1.4;}

/* Period section */
.period-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-light);}
.period-header-left{display:flex;align-items:center;gap:8px;}
.period-icon{font-size:16px;}
.period-label{font-size:14px;color:var(--fg);font-weight:500;}
.counter{display:flex;align-items:center;gap:12px;}
.counter-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;cursor:pointer;background:transparent;transition:.15s;}
.counter-btn:hover{border-color:var(--c-brand);background:var(--c-brand-subtle);}
.counter-btn svg{width:14px;height:14px;stroke:var(--fg-2);fill:none;stroke-width:2;stroke-linecap:round;}
.counter-btn:hover svg{stroke:var(--c-brand);}
.counter-val{font-size:16px;font-weight:600;color:var(--fg);min-width:20px;text-align:center;font-family:var(--ff-mono);}
.period-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 12px 44px;border-bottom:1px solid var(--border-light);}
.period-row:last-child{border-bottom:none;}
.period-name{font-size:13px;color:var(--fg);}
.period-time{font-size:13px;color:var(--fg-3);display:flex;align-items:center;gap:4px;font-family:var(--ff-mono);}
.period-time .arrow{width:12px;height:12px;stroke:var(--fg-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* Bottom bar */
.bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,20px));background:transparent;}
.save-btn{width:100%;padding:15px;background:var(--dark-btn);color:#fff;border:none;border-radius:var(--r-md);font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.02em;box-shadow:0 4px 14px rgba(24,30,37,.22);}
</style>
</head>
<body>
<main class="phone" data-component="Schedule Form">
  <div class="statusbar"><span>15:39</span><span class="right"><svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg><svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6.5 4.6L2 6.1c1.8-1.6 4.1-2.5 6.5-2.5 2.4 0 4.7.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6 5 9.1c1-.9 2.2-1.4 3.5-1.4 1.3 0 2.5.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6.7-5 2zM6.5 10.6l2 2 2-2c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8z"/></svg><svg class="battery" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4" fill="currentColor" fill-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg></span></div>

  <!-- Nav -->
  <div class="nav" data-component="Nav Bar">
    <div class="nav-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="nav-title">新建课表</div>
    <div class="nav-actions">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--fg)" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="var(--fg)" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></div>
    </div>
  </div>

  <div class="content">
    <!-- Steps -->
    <div class="steps" data-component="Steps">
      <div class="step active">
        <div class="step-dot">1</div>
        <div class="step-info">
          <span class="step-text">创建课表</span>
          <span class="step-desc">学期与时间设置</span>
        </div>
      </div>
      <div class="step-connector"></div>
      <div class="step">
        <div class="step-dot">2</div>
        <div class="step-info">
          <span class="step-text">添加课程</span>
          <span class="step-desc">录入课程信息</span>
        </div>
      </div>
    </div>

    <!-- 学年 -->
    <div class="form-card" data-component="Academic Year">
      <div class="form-section-title">选择学年</div>
      <div class="form-row">
        <span class="form-label">学期</span>
        <span class="form-value filled">2025~2026 下学期 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="form-subtext">默认按当前日期推算学期</div>
    </div>

    <!-- 日期与周数 -->
    <div class="form-card" data-component="Date & Weeks">
      <div class="form-section-title">日期与周数</div>
      <div class="form-row">
        <span class="form-label">开学日期 <span class="required">*</span></span>
        <span class="form-value">用于计算当前周数 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="form-row">
        <span class="form-label">本学期周数</span>
        <span class="form-value filled">20 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
    </div>

    <!-- 归属学生 -->
    <div class="form-card" data-component="Student">
      <div class="form-section-title">归属学生</div>
      <div class="form-row">
        <span class="form-label">学生</span>
        <span class="form-value filled">默认学生 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
    </div>

    <!-- 设置时间 -->
    <div class="form-card" data-component="Morning">
      <div class="form-section-title">设置时间</div>
      <div class="period-header">
        <div class="period-header-left">
          <span class="period-icon">☀️</span>
          <span class="period-label">上午课节数</span>
        </div>
        <div class="counter">
          <div class="counter-btn"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div>
          <span class="counter-val">4</span>
          <div class="counter-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        </div>
      </div>
      <div class="period-row"><span class="period-name">第1节课</span><span class="period-time">08:10–08:50 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></div>
      <div class="period-row"><span class="period-name">第2节课</span><span class="period-time">09:00–09:40 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></div>
      <div class="period-row"><span class="period-name">第3节课</span><span class="period-time">09:50–10:30 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></div>
      <div class="period-row"><span class="period-name">第4节课</span><span class="period-time">10:40–11:20 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></div>
    </div>

    <div class="form-card" data-component="Afternoon">
      <div class="period-header">
        <div class="period-header-left">
          <span class="period-icon">🌤</span>
          <span class="period-label">下午课节数</span>
        </div>
        <div class="counter">
          <div class="counter-btn"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div>
          <span class="counter-val">4</span>
          <div class="counter-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        </div>
      </div>
      <div class="period-row"><span class="period-name">第5节课</span><span class="period-time">14:00–14:40 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></div>
      <div class="period-row"><span class="period-name">第6节课</span><span class="period-time">14:50–15:30 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></div>
      <div class="period-row"><span class="period-name">第7节课</span><span class="period-time">15:40–16:20 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></div>
      <div class="period-row"><span class="period-name">第8节课</span><span class="period-time">16:30–17:10 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></div>
    </div>

    <div class="form-card" data-component="Evening">
      <div class="period-header">
        <div class="period-header-left">
          <span class="period-icon">🌙</span>
          <span class="period-label">晚上课节数</span>
        </div>
        <div class="counter">
          <div class="counter-btn"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div>
          <span class="counter-val">0</span>
          <div class="counter-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="save-btn">保存</button>
  </div>
</main>
</body>
</html>
