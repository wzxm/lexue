<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 显示设置 - 智鑫课表</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#e8eaed;display:grid;place-items:center;min-height:100vh;font-family:var(--ff);}
.phone{width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative;}
.status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);flex-shrink:0;}
.status-bar .time{font-size:15px;font-weight:600;color:var(--fg);}
.status-bar .icons{display:flex;gap:6px;align-items:center;}
.nav-bar{height:48px;display:flex;align-items:center;padding:0 16px;background:var(--surface);flex-shrink:0;border-bottom:1px solid var(--border-light);}
.nav-bar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-bar .title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;color:var(--fg);}
.content{flex:1;overflow-y:auto;padding:20px 20px 100px;}
.section-label{font-size:13px;color:var(--fg-3);font-weight:500;margin-bottom:10px;padding-left:4px;}
.form-card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:20px;}
.theme-options{display:flex;gap:10px;}
.theme-opt{flex:1;border:2px solid var(--border);border-radius:var(--r-sm);padding:16px 8px;text-align:center;cursor:pointer;transition:border .2s;}
.theme-opt.active{border-color:var(--c-brand);background:var(--c-brand-subtle);}
.theme-opt svg{margin-bottom:8px;}
.theme-opt span{font-size:12px;color:var(--fg-2);font-weight:500;display:block;}
.theme-opt.active span{color:var(--c-brand);}
.preview-section{margin-bottom:20px;}
.mini-preview{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:12px;border:1px solid var(--border-light);}
.mini-phone{width:100%;height:140px;background:var(--bg);border-radius:var(--r-sm);overflow:hidden;padding:8px;display:flex;flex-direction:column;gap:4px;}
.mini-row{display:flex;gap:4px;flex:1;}
.mini-cell{border-radius:3px;flex:1;}
.mini-header{height:14px;background:var(--surface);border-radius:3px;margin-bottom:4px;display:flex;align-items:center;padding:0 6px;}
.mini-dot{width:4px;height:4px;border-radius:50%;margin-right:3px;}
.mini-bar{height:6px;border-radius:2px;flex:1;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border-light);}
.toggle-row:last-child{border-bottom:none;}
.toggle-label{font-size:14px;color:var(--fg);}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;}
.toggle.on{background:var(--c-brand);}
.toggle::after{content:'';width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .2s;}
.toggle.on::after{transform:translateX(18px);}
.val-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;}
.val-text{font-size:13px;color:var(--fg-3);}
.bottom-fixed{position:absolute;bottom:0;left:0;right:0;padding:12px 20px 34px;background:linear-gradient(transparent,var(--bg) 20%);}
.btn-primary{width:100%;height:48px;border-radius:var(--r-pill);background:var(--c-brand);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;}
</style>
</head>
<body>
<main class="phone" data-component="Display Settings">
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="var(--fg)"/><rect x="4.5" y="4" width="3" height="8" rx="1" fill="var(--fg)"/><rect x="9" y="1" width="3" height="11" rx="1" fill="var(--fg)"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="var(--fg)" opacity=".3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2C5.5 2 3.2 3 1.5 4.7L0 3.2C2.1 1.2 4.9 0 8 0s5.9 1.2 8 3.2l-1.5 1.5C12.8 3 10.5 2 8 2z" fill="var(--fg)"/><path d="M8 5.5c-1.7 0-3.2.7-4.3 1.8L2.2 5.8C3.7 4.3 5.7 3.5 8 3.5s4.3.8 5.8 2.3l-1.5 1.5C11.2 6.2 9.7 5.5 8 5.5z" fill="var(--fg)"/><circle cx="8" cy="10" r="2" fill="var(--fg)"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2" stroke="var(--fg)" stroke-width="1" fill="none"/><rect x="22" y="4" width="2" height="4" rx="1" fill="var(--fg)" opacity=".4"/><rect x="1.5" y="2.5" width="15" height="7" rx="1" fill="var(--fg)"/></svg>
    </span>
  </div>
  <div class="nav-bar">
    <div class="back"><svg width="10" height="18" viewBox="0 0 10 18" fill="none"><path d="M9 1L1 9l8 8" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="title">显示设置</span>
  </div>
  <div class="content">
    <div class="section-label">主题模式</div>
    <div class="form-card">
      <div class="theme-options">
        <div class="theme-opt active">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="var(--c-brand)" stroke-width="1.8"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="var(--c-brand)" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>浅色</span>
        </div>
        <div class="theme-opt">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" stroke="var(--fg-3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>深色</span>
        </div>
        <div class="theme-opt">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="3" stroke="var(--fg-3)" stroke-width="1.8"/><line x1="5" y1="12" x2="19" y2="12" stroke="var(--fg-3)" stroke-width="1.2" stroke-dasharray="2 2"/></svg>
          <span>跟随系统</span>
        </div>
      </div>
    </div>
    <div class="preview-section">
      <div class="section-label">预览效果</div>
      <div class="mini-preview">
        <div class="mini-phone">
          <div class="mini-header"><span class="mini-dot" style="background:var(--c-brand)"></span><div class="mini-bar" style="background:var(--border-light);width:40%"></div></div>
          <div class="mini-row"><div class="mini-cell" style="background:var(--c-brand-subtle)"></div><div class="mini-cell" style="background:#dbeafe"></div><div class="mini-cell" style="background:var(--c-brand-subtle)"></div><div class="mini-cell" style="background:#fef3c7"></div><div class="mini-cell" style="background:var(--c-brand-subtle)"></div></div>
          <div class="mini-row"><div class="mini-cell" style="background:#fee2e2"></div><div class="mini-cell" style="background:var(--c-brand-subtle)"></div><div class="mini-cell" style="background:#dcfce7"></div><div class="mini-cell" style="background:var(--c-brand-subtle)"></div><div class="mini-cell" style="background:#e0e7ff"></div></div>
          <div class="mini-row"><div class="mini-cell" style="background:var(--c-brand-subtle)"></div><div class="mini-cell" style="background:#fce7f3"></div><div class="mini-cell" style="background:var(--c-brand-subtle)"></div><div class="mini-cell" style="background:#cffafe"></div><div class="mini-cell" style="background:var(--c-brand-subtle)"></div></div>
        </div>
      </div>
    </div>
    <div class="section-label">其他显示</div>
    <div class="form-card">
      <div class="toggle-row"><span class="toggle-label">显示周末</span><div class="toggle"></div></div>
      <div class="toggle-row"><span class="toggle-label">显示空课节</span><div class="toggle on"></div></div>
      <div class="toggle-row" style="border-bottom:none;cursor:pointer;"><span class="toggle-label">课程格子高度</span><span style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--fg-3);">标准<svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1l6 6-6 6" stroke="var(--fg-3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    </div>
  </div>
  <div class="bottom-fixed">
    <button class="btn-primary">保存设置</button>
  </div>
</main>
</body>

</html>
