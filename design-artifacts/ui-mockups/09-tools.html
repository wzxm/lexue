<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09 工具箱 - 乐学课表</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#e8eaed;display:grid;place-items:center;min-height:100vh;font-family:var(--ff);}
.phone{position:relative;width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;}
.status-bar{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);}
.status-time{font-size:15px;font-weight:600;color:var(--fg);}
.status-icons{display:flex;align-items:center;gap:5px;}
.status-icons svg{width:16px;height:16px;color:var(--fg);}
.nav{flex:0 0 48px;display:flex;align-items:center;justify-content:center;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border-light);}
.nav h1{font-size:17px;font-weight:600;color:var(--fg);}
.content{flex:1;overflow-y:auto;padding:16px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tool-card{background:var(--surface);border-radius:var(--r-md);padding:20px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s;}
.tool-card:active{transform:scale(.97);}
.tool-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.tool-icon svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.tool-icon-blue{background:var(--c-brand-subtle);}
.tool-icon-blue svg{stroke:var(--c-brand);}
.tool-icon-green{background:#f0fdf4;}
.tool-icon-green svg{stroke:var(--success);}
.tool-icon-orange{background:#fff7ed;}
.tool-icon-orange svg{stroke:#f97316;}
.tool-icon-purple{background:#faf5ff;}
.tool-icon-purple svg{stroke:#0d9488;}
.tool-icon-teal{background:#f0fdfa;}
.tool-icon-teal svg{stroke:#14b8a6;}
.tool-icon-rose{background:#fff1f2;}
.tool-icon-rose svg{stroke:#f43f5e;}
.tool-title{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px;}
.tool-desc{font-size:12px;color:var(--fg-3);line-height:1.4;}
.tab-bar{flex:0 0 83px;display:flex;align-items:flex-start;justify-content:space-around;padding-top:8px;background:var(--surface);border-top:1px solid var(--border-light);}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;}
.tab-item svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.tab-item span{font-size:10px;font-weight:500;}
.tab-item.active svg{stroke:var(--c-brand);}
.tab-item.active span{color:var(--c-brand);}
.tab-item:not(.active) svg{stroke:var(--fg-3);}
.tab-item:not(.active) span{color:var(--fg-3);}
.home-indicator{flex:0 0 0px;}
</style>
</head>
<body>
<main class="phone" data-component="Tools Page">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h2v4H2zm4-4h2v8H6zm4-4h2v12h-2zm4-4h2v16h-2zm4 8h2v8h-2z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 00-6 0zm-4-4l2 2a7.07 7.07 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="8" width="12" height="8" rx="1" fill="currentColor" opacity=".7"/><path d="M22 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div class="nav">
    <h1>工具</h1>
  </div>
  <div class="content">
    <div class="grid">
      <div class="tool-card">
        <div class="tool-icon tool-icon-blue"><svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg></div>
        <div class="tool-title">作业记录</div>
        <div class="tool-desc">记录每日作业</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon tool-icon-green"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></div>
        <div class="tool-title">考试安排</div>
        <div class="tool-desc">管理考试时间</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon tool-icon-orange"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><path d="M8 7h8M8 11h6"/></svg></div>
        <div class="tool-title">备忘录</div>
        <div class="tool-desc">随手记笔记</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon tool-icon-purple"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
        <div class="tool-title">AI 识别课表</div>
        <div class="tool-desc">拍照导入课程</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon tool-icon-teal"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></div>
        <div class="tool-title">复制课表</div>
        <div class="tool-desc">从已有课表复制</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon tool-icon-rose"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg></div>
        <div class="tool-title">分享课表</div>
        <div class="tool-desc">分享给家人</div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>课表</span>
    </div>
    <div class="tab-item active">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 00-8 0v2"/></svg>
      <span>工具</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>设置</span>
    </div>
  </div>
  <div class="home-indicator"></div>
</main>
</body>

</html>
