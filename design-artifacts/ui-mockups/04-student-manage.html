<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="canvas:aspect-ratio" content="375:812"/>
<title>04 学生管理 - 乐学课表</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#e8eaed;display:grid;place-items:center;font-family:var(--ff);-webkit-font-smoothing:antialiased;}
.phone{position:relative;width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;}
.statusbar{flex:0 0 44px;padding:14px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:600;color:var(--fg);background:var(--surface);}
.statusbar .right{display:flex;align-items:center;gap:5px;}
.statusbar svg{width:16px;height:10px;fill:var(--fg);}
.statusbar .battery{width:24px;}
.nav{flex:0 0 48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border-light);}
.nav-back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;}
.nav-back svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;}
.nav h1{font-size:16px;font-weight:600;color:var(--fg);letter-spacing:-.01em;}
.nav-action{width:36px;height:36px;}
.content{flex:1;overflow-y:auto;padding:12px 16px 32px;}
.content::-webkit-scrollbar{display:none;}

/* Tip card */
.tip-card{background:var(--c-brand-subtle);border:1px solid var(--c-brand-light);border-radius:var(--r-md);padding:12px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;}
.tip-card svg{width:18px;height:18px;stroke:var(--c-brand);fill:none;stroke-width:2;flex-shrink:0;margin-top:1px;}
.tip-card p{font-size:12.5px;color:var(--c-brand-deep);line-height:1.5;}

/* Group header */
.group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px;}
.group-title{font-size:13px;font-weight:600;color:var(--fg-2);letter-spacing:.02em;}
.group-count{font-size:11px;color:var(--fg-3);font-family:var(--ff-mono);}

/* Student card */
.student-card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;margin-bottom:8px;cursor:pointer;transition:.15s;position:relative;}
.student-card:active{transform:scale(.98);}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.avatar.blue{background:linear-gradient(135deg,#3b82f6,#2563eb);}
.avatar.green{background:linear-gradient(135deg,#22c55e,#16a34a);}
.avatar.purple{background:linear-gradient(135deg,#0d9488,#0f766e);}
.avatar.orange{background:linear-gradient(135deg,#f97316,#ea580c);}
.student-info{flex:1;min-width:0;}
.student-name{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:2px;}
.student-school{font-size:12px;color:var(--fg-3);}
.student-actions{display:flex;gap:6px;}
.action-icon{width:32px;height:32px;border-radius:50%;background:var(--surface-muted);border:1px solid var(--border-light);display:grid;place-items:center;cursor:pointer;}
.action-icon svg{width:15px;height:15px;stroke:var(--fg-3);fill:none;stroke-width:1.8;}

/* Shared badge */
.shared-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;background:var(--c-brand-subtle);color:var(--c-brand);border-radius:var(--r-pill);font-size:10px;font-weight:600;margin-top:4px;}
.shared-badge svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;}

/* Add student card */
.add-card{background:var(--surface);border:2px dashed var(--border);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.15s;margin-bottom:8px;}
.add-card:hover{border-color:var(--c-brand-light);background:var(--c-brand-subtle);}
.add-card svg{width:28px;height:28px;stroke:var(--c-brand);fill:none;stroke-width:1.8;}
.add-card span{font-size:13px;color:var(--fg-3);font-weight:500;}

/* Section divider */
.section-gap{height:20px;}
</style>
</head>
<body>
<main class="phone" data-component="Student Manage">
  <div class="statusbar"><span>9:41</span><span class="right"><svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg><svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6.5 4.6L2 6.1c1.8-1.6 4.1-2.5 6.5-2.5 2.4 0 4.7.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6 5 9.1c1-.9 2.2-1.4 3.5-1.4 1.3 0 2.5.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6.7-5 2zM6.5 10.6l2 2 2-2c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8z"/></svg><svg class="battery" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4" fill="currentColor" fill-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg></span></div>

  <div class="nav">
    <div class="nav-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1>学生管理</h1>
    <div class="nav-action"></div>
  </div>

  <div class="content">
    <div class="tip-card" data-component="Tip Card">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <p>添加孩子信息后，可以为每个孩子创建独立的课表。共享的学生会显示在"共享学生"分组中。</p>
    </div>

    <div data-component="My Students">
      <div class="group-header">
        <span class="group-title">我的学生</span>
        <span class="group-count">2 人</span>
      </div>

      <div class="student-card">
        <div class="avatar blue">明</div>
        <div class="student-info">
          <div class="student-name">小明</div>
          <div class="student-school">阳光小学 · 三年级二班</div>
        </div>
        <div class="student-actions">
          <div class="action-icon"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
        </div>
      </div>

      <div class="student-card">
        <div class="avatar purple">红</div>
        <div class="student-info">
          <div class="student-name">小红</div>
          <div class="student-school">育才中学 · 初一三班</div>
        </div>
        <div class="student-actions">
          <div class="action-icon"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
        </div>
      </div>

      <div class="add-card">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        <span>添加学生</span>
      </div>
    </div>

    <div class="section-gap"></div>

    <div data-component="Shared Students">
      <div class="group-header">
        <span class="group-title">共享学生</span>
        <span class="group-count">1 人</span>
      </div>

      <div class="student-card">
        <div class="avatar green">刚</div>
        <div class="student-info">
          <div class="student-name">小刚</div>
          <div class="student-school">实验中学 · 初二一班</div>
          <div class="shared-badge">
            <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            家人共享中
          </div>
        </div>
        <div class="student-actions">
          <div class="action-icon" aria-label="查看"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>

</html>
