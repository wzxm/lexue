<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="canvas:aspect-ratio" content="375:812">
  <title>分享课表 - 清新自然</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --brand: #3b82f6;
      --brand-deep: #1456f0;
      --brand-hover: #2563eb;
      --brand-light: #bfdbfe;
      --brand-subtle: #eff6ff;
      --bg: #f5f8fd;
      --bg-end: #fafcff;
      --surface: #ffffff;
      --surface-muted: #f9fbff;
      --text-dark: #1a1a2e;
      --text-secondary: #45515e;
      --text-tertiary: #8e8e93;
      --border: #dbe5f0;
      --border-light: #edf2f9;
      --warn: #e8a838;
      --success: #22c55e;
      --danger: #ef6b6b;
      --shadow-sm: 0 1px 4px rgba(59,130,246,.06);
      --shadow-md: 0 4px 16px rgba(59,130,246,.08);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --radius-pill: 999px;
      --phone-bg: #e2e8f0;
      --phone-shadow: 0 8px 40px rgba(59,130,246,.12), 0 0 0 1px rgba(59,130,246,.06);
      --warn-bg: #fefce8;
      --warn-text: #78713c;
      --icon-dark: #1a1a2e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--phone-bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
      -webkit-font-smoothing: antialiased;
    }

    .phone {
      width: 375px;
      min-height: 812px;
      background: var(--bg);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: var(--phone-shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 10px;
      background: var(--surface);
      position: relative;
      z-index: 2;
    }

    .status-time {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      letter-spacing: .02em;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--icon-dark);
    }

    .status-icons svg {
      display: block;
    }

    /* Nav Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      padding: 10px 18px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-light);
      position: relative;
      z-index: 2;
    }

    .nav-back {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
      color: var(--icon-dark);
    }

    .nav-back:hover {
      background: var(--brand-subtle);
    }

    .nav-back svg {
      display: block;
    }

    .nav-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-dark);
      margin-right: 32px;
    }

    /* Content */
    .content {
      padding: 18px;
      flex: 1;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-end) 100%);
    }

    /* Tip Card */
    .tip-card {
      background: var(--surface-muted);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }

    .tip-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tip-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .tip-bullet {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--brand-light);
      flex-shrink: 0;
      margin-top: 7px;
    }

    .tip-warn {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--warn-bg);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--warn-text);
      line-height: 1.6;
    }

    .tip-warn-icon {
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--warn-text);
    }

    /* Group Header */
    .group-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: .03em;
      margin-bottom: 12px;
      padding-left: 2px;
    }

    /* Share Card */
    .share-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      border-top: 3px solid var(--brand-light);
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-md);
    }

    .share-card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .share-divider {
      height: 1px;
      background: var(--border-light);
      margin-bottom: 14px;
    }

    .code-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .code-label {
      font-size: 12.5px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    .code-value {
      font-family: "SF Mono", "Fira Code", "Cascadia Code", "JetBrains Mono", Menlo, monospace;
      font-size: 15px;
      font-weight: 500;
      color: var(--brand-deep);
      letter-spacing: .08em;
      flex: 1;
    }

    .code-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background .2s;
      color: var(--brand);
    }

    .btn-icon:hover {
      background: var(--brand-subtle);
    }

    .btn-icon svg {
      display: block;
    }

    .btn-copy {
      font-size: 12px;
      font-weight: 500;
      color: var(--brand);
      background: var(--brand-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-pill);
      padding: 5px 14px;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }

    .btn-copy:hover {
      background: var(--brand-light);
      border-color: var(--brand-light);
    }
  </style>
</head>
<body>
  <main class="phone" data-component="Share Schedule - Fresh">

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-time">12:16</span>
      <div class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
          <rect x="0" y="7" width="3" height="4" rx="0.8" fill="currentColor"/>
          <rect x="4.5" y="5" width="3" height="6" rx="0.8" fill="currentColor"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="0.8" fill="currentColor"/>
          <rect x="13.5" y="0" width="3" height="11" rx="0.8" fill="currentColor"/>
        </svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
          <path d="M8 2.5C10.6 2.5 12.9 3.6 14.5 5.4L15.6 4.3C13.7 2.2 11 0.9 8 0.9C5 0.9 2.3 2.2 0.4 4.3L1.5 5.4C3.1 3.6 5.4 2.5 8 2.5Z" fill="currentColor"/>
          <path d="M8 5.8C9.7 5.8 11.2 6.5 12.3 7.6L13.4 6.5C12 5.1 10.1 4.2 8 4.2C5.9 4.2 4 5.1 2.6 6.5L3.7 7.6C4.8 6.5 6.3 5.8 8 5.8Z" fill="currentColor"/>
          <circle cx="8" cy="9.8" r="1.2" fill="currentColor"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" stroke-opacity="0.3"/>
          <rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="currentColor" fill-opacity="0.3"/>
          <rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <!-- Nav Bar -->
    <div class="nav-bar">
      <div class="nav-back">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none">
          <path d="M10.5 1.5L2 10L10.5 18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="nav-title">分享课表</span>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Tip Card -->
      <div class="tip-card">
        <ul class="tip-list">
          <li class="tip-item">
            <span class="tip-bullet"></span>
            <span>仅能分享自己创建的课表，每个课表有独立口令。</span>
          </li>
          <li class="tip-item">
            <span class="tip-bullet"></span>
            <span>分享后，任何人获得口令均可复制课表。</span>
          </li>
        </ul>
        <div class="tip-warn">
          <svg class="tip-warn-icon" width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M7.5 1L14.43 13H0.57L7.5 1Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="7.5" y1="5.5" x2="7.5" y2="9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <circle cx="7.5" cy="11" r="0.6" fill="currentColor"/>
          </svg>
          <span>复制课表不会复制学生任何信息、不会复制老师电话。</span>
        </div>
      </div>

      <!-- Group Header -->
      <div class="group-header">默认学生</div>

      <!-- Share Card 1 -->
      <div class="share-card">
        <div class="share-card-title">2025~2026 下学期课表</div>
        <div class="share-divider"></div>
        <div class="code-row">
          <span class="code-label">口令:</span>
          <span class="code-value">KH6W GDNZ</span>
          <div class="code-actions">
            <button class="btn-icon" aria-label="刷新口令">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
            </button>
            <button class="btn-copy">复制</button>
          </div>
        </div>
      </div>

      <!-- Share Card 2 -->
      <div class="share-card">
        <div class="share-card-title">2025~2026 上学期课表</div>
        <div class="share-divider"></div>
        <div class="code-row">
          <span class="code-label">口令:</span>
          <span class="code-value">BMRQ CRQM</span>
          <div class="code-actions">
            <button class="btn-icon" aria-label="刷新口令">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
            </button>
            <button class="btn-copy">复制</button>
          </div>
        </div>
      </div>

    </div>

  </main>
</body>
</html>
