<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 分享课表 - 乐学课表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
body{background:#e8eaed;display:grid;place-items:center;min-height:100vh;font-family:var(--ff);}
.phone{width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative;}
.status-bar{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;background:var(--surface);flex-shrink:0;}
.status-bar .time{font-size:15px;font-weight:600;color:var(--fg);}
.status-bar .icons{display:flex;gap:5px;align-items:center;}
.status-bar .icons svg{width:16px;height:16px;}
.nav-bar{height:48px;display:flex;align-items:center;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border-light);flex-shrink:0;}
.nav-bar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-bar .back svg{width:20px;height:20px;color:var(--fg);}
.nav-bar .title{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--fg);margin-right:32px;}
.content{flex:1;overflow-y:auto;padding:16px 20px;}
.instruction{font-size:14px;color:var(--fg-2);margin-bottom:16px;padding:0 2px;}
.schedule-card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:box-shadow .2s;}
.schedule-card:active{box-shadow:var(--shadow-md);}
.card-icon{width:44px;height:44px;border-radius:12px;background:var(--c-brand-subtle);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card-icon svg{width:22px;height:22px;color:var(--c-brand);}
.card-body{flex:1;min-width:0;}
.card-name{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px;}
.card-meta{font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:6px;}
.card-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--fg-3);opacity:.5;}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--r-pill);}
.badge-success{background:#dcfce7;color:var(--success);}
.card-action{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--surface-muted);display:flex;align-items:center;justify-content:center;}
.card-action svg{width:18px;height:18px;color:var(--fg-3);}
</style>
</head>
<body>
<main class="phone" data-component="Share Schedule">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg viewBox="0 0 18 18" fill="currentColor"><rect x="1" y="10" width="3" height="6" rx="1" fill="#1a1a2e"/><rect x="5.5" y="7" width="3" height="9" rx="1" fill="#1a1a2e"/><rect x="10" y="4" width="3" height="12" rx="1" fill="#1a1a2e"/><rect x="14.5" y="1" width="3" height="15" rx="1" fill="#1a1a2e"/></svg>
      <svg viewBox="0 0 18 18" fill="none"><path d="M9 4C6 4 3.5 5.2 1.5 7.2L3 8.7C4.6 7.1 6.7 6 9 6s4.4 1.1 6 2.7l1.5-1.5C14.5 5.2 12 4 9 4z" fill="#1a1a2e"/><path d="M9 8C7 8 5.2 8.8 4 10.1L5.5 11.6C6.3 10.8 7.6 10 9 10s2.7.8 3.5 1.6L14 10.1C12.8 8.8 11 8 9 8z" fill="#1a1a2e"/><circle cx="9" cy="14" r="2" fill="#1a1a2e"/></svg>
      <svg viewBox="0 0 28 14" fill="none"><rect x=".5" y=".5" width="23" height="13" rx="3" stroke="#1a1a2e" stroke-opacity=".35"/><rect x="2" y="2" width="18" height="10" rx="1.5" fill="#1a1a2e"/><path d="M25 5v4a2.5 2.5 0 000-4z" fill="#1a1a2e" opacity=".4"/></svg>
    </div>
  </div>
  <!-- Nav Bar -->
  <div class="nav-bar">
    <div class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="title">分享课表</div>
  </div>
  <!-- Content -->
  <div class="content">
    <p class="instruction">选择要分享给家人的课表</p>

    <div class="schedule-card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <div class="card-body">
        <div class="card-name">小明 · 2025春季学期</div>
        <div class="card-meta">
          <span>7门课程</span>
          <span class="badge badge-success">已分享</span>
        </div>
      </div>
      <div class="card-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </div>
    </div>

    <div class="schedule-card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <div class="card-body">
        <div class="card-name">小明 · 2024秋季学期</div>
        <div class="card-meta">
          <span>6门课程</span>
          <span class="dot"></span>
          <span>已归档</span>
        </div>
      </div>
      <div class="card-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </div>
    </div>

    <div class="schedule-card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <div class="card-body">
        <div class="card-name">小红 · 2025春季学期</div>
        <div class="card-meta">
          <span>8门课程</span>
          <span class="badge badge-success">已分享</span>
        </div>
      </div>
      <div class="card-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </div>
    </div>
  </div>
</main>
</body>

</html>
