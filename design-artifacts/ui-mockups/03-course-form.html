<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="canvas:aspect-ratio" content="375:812"/>
<title>03 课程编辑 - 课表管家</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--shadow-brand:0 4px 16px rgba(59,130,246,.12);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#e8eaed;display:grid;place-items:center;font-family:var(--ff);-webkit-font-smoothing:antialiased;}
.phone{position:relative;width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;}

/* Status bar */
.statusbar{flex:0 0 44px;padding:14px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:600;color:var(--fg);}
.statusbar .right{display:flex;align-items:center;gap:5px;}
.statusbar svg{width:16px;height:10px;fill:var(--fg);}
.statusbar .battery{width:24px;}

/* Nav */
.nav{flex:0 0 48px;padding:0 8px;display:flex;align-items:center;background:transparent;}
.nav-back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;}
.nav-back svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-title{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--fg);margin-right:40px;}
.nav-actions{display:flex;align-items:center;gap:2px;}
.nav-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;}
.nav-icon svg{width:20px;height:20px;fill:var(--fg);}

.content{flex:1;overflow-y:auto;padding:12px 16px 120px;}
.content::-webkit-scrollbar{display:none;}

/* Form card */
.form-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px;}
.form-section-title{padding:14px 16px 6px;font-size:12px;color:var(--fg-3);font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
.form-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-light);}
.form-row:last-child{border-bottom:none;}
.form-label{font-size:14px;color:var(--fg-2);font-weight:500;}
.form-value{font-size:14px;color:var(--fg);font-weight:500;display:flex;align-items:center;gap:6px;}
.form-value .arrow{width:14px;height:14px;stroke:var(--fg-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.form-input{border:none;outline:none;font-size:14px;color:var(--fg);text-align:right;font-family:var(--ff);background:transparent;flex:1;margin-left:12px;}
.form-input::placeholder{color:var(--fg-3);}

/* Color picker */
.color-picker{display:flex;gap:8px;flex-wrap:wrap;}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;position:relative;}
.color-dot.selected{border-color:transparent;transform:scale(1.08);box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.12);}
.color-dot.selected::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.25);}

/* Session section */
.session-title{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;}
.session-badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:var(--r-sm);background:var(--c-brand-subtle);color:var(--c-brand);font-size:12px;font-weight:700;font-family:var(--ff-mono);}
.session-label{font-size:12px;color:var(--fg-3);font-weight:500;letter-spacing:.04em;text-transform:uppercase;}

/* Add session */
.add-session{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;color:var(--c-brand);font-size:14px;font-weight:500;cursor:pointer;margin:0 0 14px;border:1.5px dashed var(--c-brand-light);border-radius:var(--r-lg);background:var(--c-brand-subtle);transition:.2s;}
.add-session:hover{background:var(--c-brand-light);border-color:var(--c-brand);}

/* Bottom bar */
.bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,20px));background:transparent;}
.save-btn{width:100%;padding:15px;background:var(--dark-btn);color:#fff;border:none;border-radius:var(--r-md);font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.02em;box-shadow:0 4px 14px rgba(24,30,37,.22);}
</style>
</head>
<body>
<main class="phone" data-component="Course Form">
  <div class="statusbar"><span>15:08</span><span class="right"><svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg><svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6.5 4.6L2 6.1c1.8-1.6 4.1-2.5 6.5-2.5 2.4 0 4.7.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6 5 9.1c1-.9 2.2-1.4 3.5-1.4 1.3 0 2.5.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6.7-5 2zM6.5 10.6l2 2 2-2c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8z"/></svg><svg class="battery" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4" fill="currentColor" fill-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg></span></div>

  <!-- Nav -->
  <div class="nav" data-component="Nav Bar">
    <div class="nav-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="nav-title">添加课程</div>
    <div class="nav-actions">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--fg)" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="var(--fg)" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></div>
    </div>
  </div>

  <div class="content">
    <!-- 课程信息 -->
    <div class="form-card" data-component="Course Info">
      <div class="form-section-title">基本信息</div>
      <div class="form-row">
        <span class="form-label">名称</span>
        <input class="form-input" placeholder="填写课程名称" aria-label="名称"/>
      </div>
      <div class="form-row">
        <span class="form-label">老师</span>
        <span class="form-value" style="color:var(--fg-3)">选填</span>
      </div>
      <div class="form-row">
        <span class="form-label">联系方式</span>
        <span class="form-value" style="color:var(--fg-3)">选填</span>
      </div>
    </div>

    <!-- 课程颜色 -->
    <div class="form-card" data-component="Color Picker">
      <div class="form-section-title">课程颜色</div>
      <div class="form-row">
        <div class="color-picker">
          <div class="color-dot" style="background:#3b82f6"></div>
          <div class="color-dot selected" style="background:#22c55e"></div>
          <div class="color-dot" style="background:#f97316"></div>
          <div class="color-dot" style="background:#0d9488"></div>
          <div class="color-dot" style="background:#f43f5e"></div>
          <div class="color-dot" style="background:#14b8a6"></div>
          <div class="color-dot" style="background:#f59e0b"></div>
          <div class="color-dot" style="background:#0891b2"></div>
        </div>
      </div>
    </div>

    <!-- 课节 1 -->
    <div class="form-card" data-component="Session 1">
      <div class="session-title">
        <span class="session-badge">课节 1</span>
      </div>
      <div class="form-row">
        <span class="form-label">节数</span>
        <span class="form-value" style="color:var(--fg-3)">请选择 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="form-row">
        <span class="form-label">周数</span>
        <span class="form-value">每周 <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="form-row">
        <span class="form-label">教室</span>
        <span class="form-value" style="color:var(--fg-3)">选填</span>
      </div>
    </div>

    <!-- 增加课节 -->
    <div class="add-session">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      增加课节
    </div>
  </div>

  <div class="bottom-bar">
    <button class="save-btn">保存</button>
  </div>
</main>
</body>
</html>
