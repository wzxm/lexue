<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 AI识别课表 - 乐学课表</title>
<style>
:root{--c-brand:#3b82f6;--c-brand-deep:#1456f0;--c-brand-hover:#2563eb;--c-brand-light:#bfdbfe;--c-brand-subtle:#eff6ff;--bg:#f5f6f8;--surface:#ffffff;--surface-muted:#f9fafb;--fg:#1a1a2e;--fg-2:#45515e;--fg-3:#8e8e93;--border:#e5e7eb;--border-light:#f2f3f5;--danger:#ef4444;--success:#16a34a;--warn:#f59e0b;--dark-btn:#181e25;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.06);--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;--ff-mono:ui-monospace,'SF Mono',Menlo,monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#e8eaed;display:grid;place-items:center;min-height:100vh;font-family:var(--ff);}
.phone{width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative;}
.status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);flex-shrink:0;}
.status-bar .time{font-size:15px;font-weight:600;color:var(--fg);}
.status-bar .icons{display:flex;gap:6px;align-items:center;}
.nav-bar{height:48px;display:flex;align-items:center;padding:0 16px;background:var(--surface);flex-shrink:0;border-bottom:1px solid var(--border-light);}
.nav-bar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-bar .title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;color:var(--fg);}
.content{flex:1;overflow-y:auto;padding:20px 20px 120px;}
.upload-area{border:2px dashed var(--c-brand-light);border-radius:var(--r-lg);background:var(--c-brand-subtle);padding:36px 20px;text-align:center;margin-bottom:20px;}
.upload-icon{width:56px;height:56px;border-radius:50%;background:var(--c-brand-light);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.upload-title{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:6px;}
.upload-sub{font-size:12px;color:var(--fg-3);margin-bottom:20px;}
.upload-btns{display:flex;gap:10px;justify-content:center;}
.btn-cam{height:40px;padding:0 20px;border-radius:var(--r-pill);background:var(--c-brand);color:#fff;font-size:13px;font-weight:500;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn-album{height:40px;padding:0 20px;border-radius:var(--r-pill);background:var(--surface);color:var(--fg-2);font-size:13px;font-weight:500;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:6px;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-size:12px;color:var(--fg-3);}
.result-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.badge-green{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r-pill);background:#dcfce7;color:var(--success);font-size:12px;font-weight:500;}
.result-sub{font-size:13px;color:var(--fg-2);}
.course-list{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);overflow:hidden;}
.course-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-light);}
.course-row:last-child{border-bottom:none;}
.c-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.c-text{font-size:13px;color:var(--fg-2);}
.more-link{font-size:13px;color:var(--c-brand);text-align:center;padding:12px;cursor:pointer;}
.bottom-fixed{position:absolute;bottom:0;left:0;right:0;padding:12px 20px 34px;background:linear-gradient(transparent,var(--bg) 20%);display:flex;flex-direction:column;gap:8px;}
.btn-primary{width:100%;height:48px;border-radius:var(--r-pill);background:var(--c-brand);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;}
.btn-ghost{width:100%;height:44px;border-radius:var(--r-pill);background:transparent;color:var(--fg-2);font-size:14px;font-weight:500;border:none;cursor:pointer;}
</style>
</head>
<body>
<main class="phone" data-component="Schedule AI">
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="var(--fg)"/><rect x="4.5" y="4" width="3" height="8" rx="1" fill="var(--fg)"/><rect x="9" y="1" width="3" height="11" rx="1" fill="var(--fg)"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="var(--fg)" opacity=".3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2C5.5 2 3.2 3 1.5 4.7L0 3.2C2.1 1.2 4.9 0 8 0s5.9 1.2 8 3.2l-1.5 1.5C12.8 3 10.5 2 8 2z" fill="var(--fg)"/><path d="M8 5.5c-1.7 0-3.2.7-4.3 1.8L2.2 5.8C3.7 4.3 5.7 3.5 8 3.5s4.3.8 5.8 2.3l-1.5 1.5C11.2 6.2 9.7 5.5 8 5.5z" fill="var(--fg)"/><circle cx="8" cy="10" r="2" fill="var(--fg)"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2" stroke="var(--fg)" stroke-width="1" fill="none"/><rect x="22" y="4" width="2" height="4" rx="1" fill="var(--fg)" opacity=".4"/><rect x="1.5" y="2.5" width="15" height="7" rx="1" fill="var(--fg)"/></svg>
    </span>
  </div>
  <div class="nav-bar">
    <div class="back"><svg width="10" height="18" viewBox="0 0 10 18" fill="none"><path d="M9 1L1 9l8 8" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="title">AI 识别课表</span>
  </div>
  <div class="content">
    <div class="upload-area">
      <div class="upload-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2v11z" stroke="var(--c-brand)" stroke-width="1.8"/><circle cx="12" cy="13" r="4" stroke="var(--c-brand)" stroke-width="1.8"/></svg>
      </div>
      <div class="upload-title">拍摄或上传课表图片</div>
      <div class="upload-sub">支持 JPG/PNG 格式</div>
      <div class="upload-btns">
        <button class="btn-cam"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2v11z" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="13" r="3" stroke="#fff" stroke-width="1.5"/></svg>拍照</button>
        <button class="btn-album"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="var(--fg-2)" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" fill="var(--fg-2)"/><path d="M21 15l-5-5L5 21" stroke="var(--fg-2)" stroke-width="1.5"/></svg>从相册选择</button>
      </div>
    </div>
    <div class="divider"><span>识别结果</span></div>
    <div class="result-header">
      <span class="badge-green"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>识别完成</span>
      <span class="result-sub">识别到 7 门课程</span>
    </div>
    <div class="course-list">
      <div class="course-row"><span class="c-dot" style="background:#3b82f6"></span><span class="c-text">语文 · 周一第1节 08:00</span></div>
      <div class="course-row"><span class="c-dot" style="background:#ef4444"></span><span class="c-text">数学 · 周二第2节 08:50</span></div>
      <div class="course-row"><span class="c-dot" style="background:#f59e0b"></span><span class="c-text">英语 · 周三第3节 10:00</span></div>
      <div class="more-link">... 还有4门课程</div>
    </div>
  </div>
  <div class="bottom-fixed">
    <button class="btn-primary">确认导入</button>
    <button class="btn-ghost">重新识别</button>
  </div>
</main>
</body>

</html>
